{% extends "../base/base.html" %}
{% block title %}Newsletter{% endblock %}
{% block content %}
<div class="min-h-screen bg-slate-50 py-12">
  <div class="mx-auto max-w-2xl px-4">
    <div class="rounded-none border border-slate-200 bg-white p-8 text-center shadow-sm">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-700">C’est bon</p>
      <h1 class="mt-2 text-2xl font-semibold text-slate-900">Merci pour votre inscription !</h1>
      <p class="mt-3 text-sm text-slate-600">{{ message|default:"Vous recevrez les nouveaux articles dès qu’ils seront publiés." }}</p>
      <a href="{% url 'blog:homepage' %}" class="mt-6 inline-flex rounded bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-800">Retour à l’accueil</a>
    </div>
  </div>
</div>
{% endblock %}
