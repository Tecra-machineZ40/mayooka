<div class="border-b border-slate-200 bg-white shadow-sm">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <a class="text-lg font-semibold text-slate-900" href="/">Mayooka</a>

    <nav class="flex items-center gap-2 text-sm text-slate-600">
      <a class="rounded px-3 py-2 hover:bg-slate-100 hover:text-slate-900" href="/">Accueil</a>
      <a class="rounded px-3 py-2 hover:bg-slate-100 hover:text-slate-900" href="{% url 'accounts:profile' %}">Profil</a>
      <a class="rounded px-3 py-2 hover:bg-slate-100 hover:text-slate-900" href="{% url 'accounts:register' %}">Créer un compte</a>
      <a class="rounded px-3 py-2 hover:bg-slate-100 hover:text-slate-900" href="{% url 'accounts:newsletter' %}">Newsletter</a>
      {% if request.user.is_authenticated %}
      <a class="rounded px-3 py-2 hover:bg-slate-100 hover:text-slate-900" href="{% url 'accounts:edit' %}">Modifier</a>
      <a class="rounded px-3 py-2 hover:bg-slate-100 hover:text-slate-900" href="{% url 'logout' %}">Déconnexion</a>
      {% else %}
      <a class="rounded px-3 py-2 hover:bg-slate-100 hover:text-slate-900" href="{% url 'login' %}">Connexion</a>
      {% endif %}
    </nav>
  </div>
</div>
